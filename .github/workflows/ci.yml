name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: "0 2 * * 1"  # Weekly demo run

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-gee.txt
          pip install pytest pytest-cov rasterio

      - name: Run tests
        run: |
          pytest
